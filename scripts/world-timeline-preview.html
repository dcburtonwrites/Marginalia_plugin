<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Copper Sky · World Timeline</title><link rel="stylesheet" href="styles.css"><style>
:root{--background-primary:#faf9f6;--background-secondary:#f0eee9;--background-modifier-border:#d8d5cf;--text-normal:#272725;--text-muted:#79766e;--text-warning:#ad7420;--font-interface:Inter,system-ui,sans-serif;--font-ui-small:13px;--font-ui-large:17px}*{box-sizing:border-box}body{margin:0;background:var(--background-primary);color:var(--text-normal);font:13px var(--font-interface)}body.theme-dark{--background-primary:#121316;--background-secondary:#1c1e22;--background-modifier-border:#2e3136;--text-normal:#d8d9dc;--text-muted:#9a9ca3;--text-warning:#d9b84a;color-scheme:dark}#timeline{height:calc(100vh - 42px)}#fixture-controls{height:42px;padding:7px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--background-modifier-border);font-size:11px}button,input{font:inherit;color:inherit;background:var(--background-secondary);border:1px solid var(--background-modifier-border);border-radius:4px;padding:5px 8px}#fixture-controls span{margin-left:auto;color:var(--text-muted)}.setting-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--background-modifier-border)}.setting-item-info{min-width:160px}.setting-item-control{display:flex;gap:8px;align-items:center}.setting-item-info p{color:var(--text-muted)}.setting-item-control input[type=checkbox]{width:18px;height:18px}.modal h2{font-family:Georgia,serif}.modal button{cursor:pointer}
</style></head><body class="theme-dark"><div id="fixture-controls"><span id="opened"></span><span id="saved"></span><span id="notice" role="status"></span></div><main id="timeline"></main><script src="world-timeline-preview.js"></script></body></html>
