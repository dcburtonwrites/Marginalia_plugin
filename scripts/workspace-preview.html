<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="styles.css"><style>
:root {--background-primary:#fff;--background-secondary:#f4f4f4;--background-modifier-border:#ddd;--text-normal:#222;--text-muted:#666;--text-accent:#7256bb;--font-ui-small:13px;--font-ui-smaller:12px;--font-ui-large:17px;--font-semibold:600;}
*{box-sizing:border-box}body{margin:0;background:var(--background-primary);color:var(--text-normal);font:14px -apple-system,BlinkMacSystemFont,sans-serif} .host{display:grid;grid-template-columns:250px minmax(0,1fr);height:100vh}aside{background:var(--background-secondary);border-right:1px solid var(--background-modifier-border);display:flex;flex-direction:column}.view-content{flex:1;overflow:auto}.nav-files-container{padding:12px}.nav-files-container div{padding:8px}main{min-width:0}button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--background-modifier-border);border-radius:4px;padding:6px 10px;background:var(--background-secondary)}input,select{padding:6px;border:1px solid var(--background-modifier-border);border-radius:4px;background:var(--background-primary)}#controls{position:fixed;bottom:0;right:0;display:flex;gap:4px;font-size:11px;background:var(--background-secondary);z-index:10}#opened{position:fixed;bottom:28px;right:8px;color:var(--text-muted);font-size:11px}body.theme-dark{--background-primary:#111;--background-secondary:#222;--text-normal:#ddd;--text-muted:#aaa;--background-modifier-border:#444}
</style></head><body class="theme-light"><div class="host"><aside><div class="view-content"><div class="nav-header">Native file controls</div><div class="nav-files-container" aria-label="Vault files"><div>00 Brainstorms</div><div>02 Character</div><div>08 Projects</div></div></div></aside><main></main></div><div id="opened"></div><div id="controls"></div><script src="workspace-preview.js"></script></body></html>
