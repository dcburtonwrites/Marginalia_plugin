<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timelines Phase 1 settings</title><link rel="stylesheet" href="styles.css"><style>
:root{--background-primary:#fff;--background-secondary:#f4f4f4;--background-modifier-border:#ddd;--text-normal:#222;--text-muted:#666;--text-accent:#8a5329;--text-warning:#ad7420;--font-ui-small:13px;--font-ui-large:17px}*{box-sizing:border-box}body{margin:0;background:var(--background-primary);color:var(--text-normal);font:14px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:920px;padding:24px;margin:auto}.setting-item{padding:12px 0;border-bottom:1px solid var(--background-modifier-border)}.setting-item-info p{margin:4px 0;color:var(--text-muted);font-size:12px}.setting-item-control{display:flex;gap:8px;align-items:center}button,input,select{font:inherit;color:inherit;border:1px solid var(--background-modifier-border);background:var(--background-secondary);border-radius:4px;padding:6px}button{cursor:pointer}input[type=checkbox]{width:18px;height:18px}body.theme-dark{--background-primary:#121316;--background-secondary:#1c1e22;--background-modifier-border:#2e3136;--text-normal:#d8d9dc;--text-muted:#9a9ca3;--text-accent:#d98e4a;--text-warning:#d9b84a;color-scheme:dark}#controls{padding:12px;display:flex;gap:8px;flex-wrap:wrap}#notice{color:var(--text-warning)}
</style></head><body><div id="controls"></div><main><h1>Marginalia settings</h1><div id="settings"></div><p id="notice" role="status"></p><p id="opened"></p></main><script src="timeline-preview.js"></script></body></html>
